# AeroSpace Configuration
# Documentation: https://nikitabobko.github.io/AeroSpace/guide
# Reference: https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

# Commands that run after AeroSpace startup
# Automatically launch JankyBorders with Tokyo Night Blue active border
after-startup-command = [
  'exec-and-forget borders active_color=0xff7aa2f7 inactive_color=0xff292e42 width=6.0 style=round hidpi=on order=above'
]

# Start AeroSpace at login (keep false for safe trial mode; toggle to true once comfortable)
start-at-login = false

# Automatically reload the config when saved
auto-reload-config = true


# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion layout settings (great for 32:9 ultrawide density)
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus across monitors
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Persistent workspaces across disconnects
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Window gaps (inner between windows, outer to screen edge)
gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
gaps.outer.top        = [{ monitor."built-in" = 8 }, { monitor."odyssey" = 44 }, 8]
gaps.outer.right      = 8

# Assign workspaces to monitors:
# Workspaces 1-6 prefer the 49" ultrawide; workspaces 7-9 prefer the built-in Retina screen.
# Degrades gracefully to single display when disconnected.
[workspace-to-monitor-force-assignment]
1 = ['secondary', 'odyssey', 'main']
2 = ['secondary', 'odyssey', 'main']
3 = ['secondary', 'odyssey', 'main']
4 = ['secondary', 'odyssey', 'main']
5 = ['secondary', 'odyssey', 'main']
6 = ['secondary', 'odyssey', 'main']
7 = ['built-in', 'main']
8 = ['built-in', 'main']
9 = ['built-in', 'main']

# Window exclusion rules: keep small utility/dialog windows floating
[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.knollsoft.Rectangle'
run = 'layout floating'

# Main keybinding mode
# Uses Alt/Option as the modifier plane so Cmd is 100% free for apps
[mode.main.binding]
    # Layouts: switch between horizontal/vertical tiles and accordion
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f     = 'fullscreen'

    # Focus navigation (hjkl)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Window movement (Shift + hjkl)
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Smart resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Workspaces (Alt + 1..9)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Move window to workspace (Alt + Shift + 1..9)
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # Workspace hopping & multi-monitor movement
    alt-tab       = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Service mode for advanced window manipulation & reset
    alt-shift-semicolon = 'mode service'

# Service binding mode
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main'] # reset layout
    f         = ['layout floating tiling', 'mode main'] # toggle floating/tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
