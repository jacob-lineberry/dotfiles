# Tokyo Night Storm, matching fzf (zsh/tools.zsh), bat, lazygit and yazi
[theme]
name = "tokyonight-storm"

[colors]
AlertInfo = "#9ece6a"
AlertWarn = "#e0af68"
AlertError = "#f7768e"
Annotation = "#565f89"
Guidance = "#565f89"
Important = "#bb9af7"
Title = "#7dcfff"
Muted = "#565f89"
SyntaxCommand = "#7aa2f7"
SyntaxFlag = "#e0af68"
SyntaxString = "#9ece6a"
SyntaxVariable = "#7dcfff"
SyntaxOperator = "#89ddff"
SyntaxComment = "#565f89"
