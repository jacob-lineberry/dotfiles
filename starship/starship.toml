palette = "tokyonight_storm"

add_newline = true
command_timeout = 200
scan_timeout = 100
continuation_prompt = "[▸▹ ](comment)"
format = "$hostname$directory$git_branch$git_state$git_commit$git_status$fill$status$jobs$cmd_duration$python$terraform$kubernetes$aws$line_break$character"

[palettes.tokyonight_storm]
bg_night = "#1a1b26"
bg_storm = "#24283b"
bg_highlight = "#292e42"
terminal_black = "#414868"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
blue1 = "#2ac3de"
magenta = "#bb9af7"
purple = "#9d7cd8"
green = "#9ece6a"
teal = "#73daca"
yellow = "#e0af68"
orange = "#ff9e64"
red = "#f7768e"
regex = "#b4f9f8"
teal_accent = "#1abc9c"

[character]
success_symbol = "[❯](bold teal)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold magenta"
repo_root_style = "bold magenta"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
format = "[$symbol$branch]($style) "
truncation_length = 30
truncation_symbol = "…"
only_attached = true
symbol = " "
style = "italic orange"

[git_status]
format = "$all_status$ahead_behind"
conflicted = "[ ](bold red)"
stashed = "[ ](magenta)"
deleted = "[ ](red)"
renamed = "[» ](yellow)"
modified = "[! ](yellow)"
staged = "[+ ](green)"
untracked = "[? ](comment)"
up_to_date = ""
ahead = "[$count ](green)"
behind = "[$count ](orange)"
diverged = "[$ahead_count ](green)[$behind_count ](orange)"

[git_state]
format = '[($state( $progress_current/$progress_total) )]($style)'
style = "orange"

[git_commit]
format = '[ $hash$tag]($style) '
style = "comment"

[hostname]
ssh_only = true
format = '[$ssh_symbol$hostname]($style) '
ssh_symbol = " "
style = "bold cyan"

[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = "✘ "
style = "red"

[jobs]
symbol = " "
style = "orange"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "comment"

[python]
format = '[( $virtualenv )]($style)'
style = "comment"

[terraform]
format = '[$symbol$workspace]($style) '
symbol = "󱁢 "
style = "purple"

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = "󱃾 "
style = "blue"

[[kubernetes.contexts]]
context_pattern = ".*(prod|prd).*"
style = "bold red"

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
symbol = " "
style = "yellow"

[fill]
symbol = "·"
style = "terminal_black"
