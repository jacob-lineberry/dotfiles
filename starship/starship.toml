palette = "catppuccin_mocha"

add_newline = true
command_timeout = 200
scan_timeout = 100
continuation_prompt = "[▸▹ ](overlay1)"
format = "$hostname$directory$git_branch$git_state$git_commit$git_status$fill$status$jobs$cmd_duration$python$terraform$kubernetes$aws$line_break$character"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold pink"
repo_root_style = "bold pink"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
format = "[$symbol$branch]($style) "
truncation_length = 30
truncation_symbol = "…"
only_attached = true
symbol = " "
style = "italic mauve"

[git_status]
format = "$all_status$ahead_behind"
conflicted = "[ ](bold red)"
stashed = "[ ](mauve)"
deleted = "[ ](red)"
renamed = "[» ](yellow)"
modified = "[ ](peach)"
staged = "[ ](green)"
untracked = "[? ](overlay1)"
up_to_date = "[ ](green)"
ahead = "[$count ](green)"
behind = "[$count ](peach)"
diverged = "[$ahead_count ](green)[$behind_count ](peach)"

[git_state]
format = '[($state( $progress_current/$progress_total) )]($style)'
style = "peach"

[git_commit]
format = '[ $hash$tag]($style) '
style = "overlay1"

[hostname]
ssh_only = true
format = '[$ssh_symbol$hostname]($style) '
ssh_symbol = " "
style = "bold teal"

[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = "✘ "
style = "red"

[jobs]
symbol = " "
style = "peach"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "overlay1"

[python]
format = '[( $virtualenv )]($style)'
style = "overlay1"

[terraform]
format = '[$symbol$workspace]($style) '
symbol = "󱁢 "
style = "mauve"

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = "󱃾 "
style = "blue"

[[kubernetes.contexts]]
context_pattern = ".*(prod|prd).*"
style = "bold red"

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
symbol = " "
style = "peach"

[fill]
symbol = "·"
style = "surface2"
