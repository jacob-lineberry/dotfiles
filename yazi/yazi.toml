[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "none"
show_hidden    = false
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 1000
max_height      = 1000
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, desc = "Editor" }
]
