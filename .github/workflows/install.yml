name: Install Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 4" # weekly: the full installs below, to catch drift in apt, Homebrew and runner images

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Install on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: macos }
          - { name: Ubuntu, os: ubuntu-latest, platform: ubuntu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Platform is detected
        env:
          EXPECTED: ${{ matrix.platform }}
        run: |
          source scripts/lib/platform.sh
          [[ $(detect_platform) == "$EXPECTED" ]]

      # No stow pre-install: setup.sh installs its own prerequisites
      - name: setup.sh on a clean machine
        run: ./setup.sh

      - name: setup.sh is idempotent
        run: |
          out=$(./setup.sh)
          if grep -q 'backed up' <<<"$out"; then echo "$out"; exit 1; fi

      - name: zsh starts cleanly
        run: |
          err=$(zsh -lic exit 2>&1 >/dev/null)
          if [[ -n $err ]]; then echo "$err"; exit 1; fi

      - run: ./scripts/checks/stow.sh

      - name: Platform-specific packages
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ $PLATFORM == macos ]]; then
            test -e ~/.config/aerospace/aerospace.toml
            test -e ~/.config/homebrew/Brewfile
            test ! -e ~/.config/bash
            if grep -qs 'config/bash/env.bash' ~/.profile ~/.bash_profile ~/.bashrc; then
              echo "bootstrap_bash must not touch ~/.profile, ~/.bash_profile or ~/.bashrc on macOS" >&2
              exit 1
            fi
          else
            test ! -e ~/.config/aerospace
            test ! -e ~/.config/homebrew
            test -e ~/.config/bash/env.bash
            grep -q 'config/bash/env.bash' ~/.profile
            grep -q 'config/bash/env.bash' ~/.bashrc
          fi
          test -e ~/.config/nvim/init.lua

      - name: git ignore rules apply without private config
        run: |
          scratch=$(mktemp -d)
          git -C "$scratch" init -q
          git -C "$scratch" check-ignore -q oauth_creds.json

      # A tool bump is the most common change here: every tool in the lockfile must install on both platforms
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
        with:
          minimum_release_age: 7d
          install_args: --locked

      # Resolves every Brewfile entry without installing it; the weekly packages job does the real install
      - name: Brewfile resolves (macOS)
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: ""
        run: ./scripts/checks/brewfile.sh

  # The clean-machine test: install the whole package list, as on a new machine. Packages rot with time rather than with
  # commits, so this runs weekly (and on demand: `gh workflow run install.yml --ref <branch>` after editing a package
  # list) instead of on every pull request, where the jobs above already cover the portable checks.
  packages:
    name: Packages on ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: macos, timeout: 45 }
          - { name: Ubuntu, os: ubuntu-latest, platform: ubuntu, timeout: 20 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise/mise.lock') }}

      - name: Provision packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: ""
        run: ./setup.sh --packages

      - name: zsh starts cleanly
        run: |
          err=$(zsh -lic exit 2>&1 >/dev/null)
          if [[ -n $err ]]; then echo "$err"; exit 1; fi

      # ruff is a mise tool: a login bash must resolve it to the mise shim, which env.bash puts first on PATH
      - name: bash finds mise tools (Ubuntu)
        if: matrix.platform == 'ubuntu'
        run: |
          got=$(bash -lc 'command -v ruff') || true
          if [[ $got != */mise/shims/ruff ]]; then
            echo "login bash resolved ruff to: ${got:-nothing}" >&2
            for f in ~/.profile ~/.bash_profile ~/.bash_login ~/.bashrc; do [[ -e $f ]] && echo "present: $f" >&2; done
            exit 1
          fi
