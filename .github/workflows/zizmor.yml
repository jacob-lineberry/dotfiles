name: zizmor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The online audits (known-vulnerable-actions, impostor-commit) use advisory data that
  # changes without any code change, so scan weekly too.
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings fail this job and show as PR annotations instead of going to code scanning.
      # The action defaults to the latest zizmor, so the version is pinned here and bumped by
      # hand (Dependabot only bumps the action); keep it in step with .pre-commit-config.yaml.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
